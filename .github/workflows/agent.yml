name: Agent

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'skills/**'
      - '.agents/**'
      - 'tests/**'
      - 'charts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/agent.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'skills/**'
      - '.agents/**'
      - 'tests/**'
      - 'charts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/agent.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Test and Lint Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit Tests
        run: pytest -q

      - name: Lint Chart
        run: helm lint charts/sportsagentic-agent --set secrets.existingSecret=agent-secrets

  publish:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name == 'push'
    env:
      IMAGE: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/sportsagentic/agent-model
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
