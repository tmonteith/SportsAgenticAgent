apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sportsagentic-agent.fullname" . }}
  labels:
    {{- include "sportsagentic-agent.labels" . | nindent 4 }}
data:
  MCP_SERVER_URL: {{ .Values.config.mcpServerUrl | quote }}
  MCP_TIMEOUT_SECONDS: {{ .Values.config.mcpTimeoutSeconds | quote }}
  LLAMA_SERVER_URL: {{ .Values.config.llamaServerUrl | quote }}
  LLAMA_MODEL: {{ .Values.config.llamaModel | quote }}
  LLAMA_TIMEOUT_SECONDS: {{ .Values.config.llamaTimeoutSeconds | quote }}
  GEMINI_MODEL: {{ .Values.config.geminiModel | quote }}
  GEMINI_TIMEOUT_SECONDS: {{ .Values.config.geminiTimeoutSeconds | quote }}
  GEMINI_BASE_URL: {{ .Values.config.geminiBaseUrl | quote }}
  DEFAULT_LLM_PROVIDER: {{ .Values.config.defaultLlmProvider | quote }}
  MAX_TOOL_ITERATIONS: {{ .Values.config.maxToolIterations | quote }}
  SKILLS_DIR: {{ .Values.config.skillsDir | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PORT: {{ .Values.config.port | quote }}
