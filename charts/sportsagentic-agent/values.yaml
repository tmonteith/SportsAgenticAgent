replicaCount: 1

image:
  repository: ghcr.io/tmonteith/sportsagentic-agent
  pullPolicy: IfNotPresent
  # Keep this quoted, and use --set-string for an all-digit git SHA
  tag: "latest"

# OCIR repos are private. Without this the kubelet pulls anonymously, which
# only works on a node that has already cached the image.
imagePullSecrets:
  - name: ocir-pull
nameOverride: ""
fullnameOverride: ""

# Application runtime configuration (mounted via ConfigMap)
config:
  mcpServerUrl: "http://sportsagentic:8080/sse"
  mcpTimeoutSeconds: "10.0"
  llamaServerUrl: "http://llama-server:8081/v1"
  llamaModel: "local-model"
  llamaTimeoutSeconds: "120.0"
  geminiModel: "gemini-3.8-flash"
  geminiTimeoutSeconds: "30.0"
  geminiBaseUrl: "https://generativelanguage.googleapis.com/v1beta/openai"
  defaultLlmProvider: "auto"
  maxToolIterations: "5"
  toolResultMaxChars: "2400"
  # Agent turns (/chat, /chat/stream) per client IP in a sliding window.
  # The client IP comes from X-Real-IP, which needs the ingress to see real
  # client addresses (PROXY protocol on the OCI load balancer).
  rateLimitEnabled: "true"
  rateLimitRequests: "10"
  rateLimitWindowSeconds: "3600"
  rateLimitClientIpHeader: "X-Real-IP"
  skillsDir: "skills"
  logLevel: "INFO"
  port: "8000"

# Secret management for Google Gemini backup/alternative inference
secrets:
  # Required: provide an existing Kubernetes Secret name in production, or set geminiApiKey below
  existingSecret: ""
  existingSecretKey: "GEMINI_API_KEY"
  geminiApiKey: ""
  # Set to true to run on llama-server alone, with no Gemini key and no failover.
  # This is an opt-out so that --reuse-values, which keeps the old chart's
  # defaults, can't turn Gemini off.
  geminiDisabled: false

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sportsagentic-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
